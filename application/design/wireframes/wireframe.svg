<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 706" width="1640" height="706" font-family="Helvetica, Arial, sans-serif">
  <rect width="1640" height="706" fill="#fafafa"/>
  <text x="40" y="30" font-size="20" font-weight="bold" fill="#222">Wireframe — Ponson Cuisson</text>
  <text x="40" y="48" font-size="12" fill="#666">Flow : créer une recette, voir les calories, partager la fiche (voir user-flow.md)</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333"/>
    </marker>
  </defs>

  <!-- ============ Écran 1 : Liste des recettes ============ -->
  <text x="40" y="68" font-size="14" font-weight="bold" fill="#222">1. Liste des recettes</text>
  <g transform="translate(40,76)">
    <rect width="280" height="560" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect width="280" height="50" fill="#e5e5e5" stroke="#333" stroke-width="2"/>
    <text x="16" y="31" font-size="16" font-weight="bold" fill="#222">Mes recettes</text>

    <rect x="16" y="70" width="248" height="66" fill="#f5f5f5" stroke="#555"/>
    <text x="28" y="98" font-size="14" font-weight="bold" fill="#222">Tarte au sucre</text>
    <text x="28" y="120" font-size="12" fill="#555">336 kcal / portion</text>
    <text x="246" y="108" font-size="16" fill="#555">›</text>

    <rect x="16" y="150" width="248" height="66" fill="#f5f5f5" stroke="#555"/>
    <text x="28" y="178" font-size="14" font-weight="bold" fill="#222">Pâtes au thon</text>
    <text x="28" y="200" font-size="12" fill="#555">520 kcal / portion</text>
    <text x="246" y="188" font-size="16" fill="#555">›</text>

    <rect x="16" y="230" width="248" height="66" fill="#f5f5f5" stroke="#555"/>
    <text x="28" y="258" font-size="14" font-weight="bold" fill="#222">Salade de quinoa</text>
    <text x="28" y="280" font-size="12" fill="#555">410 kcal / portion</text>
    <text x="246" y="268" font-size="16" fill="#555">›</text>

    <text x="140" y="340" font-size="11" fill="#888" text-anchor="middle">(liste vide : « Crée ta première recette »)</text>

    <rect x="16" y="500" width="248" height="44" fill="#444"/>
    <text x="140" y="527" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">+ Nouvelle recette</text>
  </g>
  <text x="40" y="668" font-size="12" fill="#444">« Nouvelle recette » ouvre l'écran 2</text>

  <line x1="324" y1="356" x2="356" y2="356" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ Écran 2 : Création / calcul ============ -->
  <text x="360" y="68" font-size="14" font-weight="bold" fill="#222">2. Création / calcul</text>
  <g transform="translate(360,76)">
    <rect width="280" height="560" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect width="280" height="50" fill="#e5e5e5" stroke="#333" stroke-width="2"/>
    <text x="16" y="31" font-size="16" font-weight="bold" fill="#222">← Nouvelle recette</text>

    <text x="16" y="76" font-size="11" fill="#555">Nom</text>
    <rect x="16" y="84" width="248" height="34" fill="#fff" stroke="#555"/>
    <text x="26" y="106" font-size="13" fill="#222">Tarte au sucre</text>

    <text x="16" y="138" font-size="11" fill="#555">Portions</text>
    <rect x="16" y="146" width="110" height="34" fill="#fff" stroke="#555"/>
    <text x="26" y="168" font-size="13" fill="#222">8</text>

    <text x="16" y="206" font-size="13" font-weight="bold" fill="#222">Ingrédients</text>

    <rect x="16" y="214" width="248" height="36" fill="#f5f5f5" stroke="#555"/>
    <text x="26" y="237" font-size="12" fill="#222">Farine</text>
    <text x="254" y="237" font-size="12" fill="#555" text-anchor="end">250 g · 910 kcal</text>

    <rect x="16" y="254" width="248" height="36" fill="#f5f5f5" stroke="#555"/>
    <text x="26" y="277" font-size="12" fill="#222">Beurre</text>
    <text x="254" y="277" font-size="12" fill="#555" text-anchor="end">100 g · 717 kcal</text>

    <rect x="16" y="294" width="248" height="36" fill="#f5f5f5" stroke="#555"/>
    <text x="26" y="317" font-size="12" fill="#222">Sucre</text>
    <text x="254" y="317" font-size="12" fill="#555" text-anchor="end">120 g · 464 kcal</text>

    <rect x="16" y="334" width="248" height="36" fill="#f5f5f5" stroke="#555"/>
    <text x="26" y="357" font-size="12" fill="#222">Crème</text>
    <text x="254" y="357" font-size="12" fill="#555" text-anchor="end">200 g · 600 kcal</text>

    <rect x="16" y="380" width="248" height="36" fill="#fff" stroke="#555" stroke-dasharray="5,3"/>
    <text x="140" y="403" font-size="13" fill="#222" text-anchor="middle">+ Ajouter un ingrédient</text>

    <rect x="16" y="430" width="248" height="64" fill="#ececec" stroke="#555"/>
    <text x="28" y="455" font-size="13" fill="#222">Total du plat</text>
    <text x="252" y="455" font-size="13" font-weight="bold" fill="#222" text-anchor="end">2 691 kcal</text>
    <text x="28" y="481" font-size="13" fill="#222">Par portion</text>
    <text x="252" y="481" font-size="15" font-weight="bold" fill="#222" text-anchor="end">336 kcal</text>

    <rect x="16" y="506" width="248" height="40" fill="#444"/>
    <text x="140" y="531" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Enregistrer</text>
  </g>
  <text x="360" y="668" font-size="12" fill="#444">Totaux recalculés à chaque ingrédient</text>
  <text x="360" y="684" font-size="12" fill="#444">« Enregistrer » ouvre l'écran 3</text>

  <line x1="644" y1="356" x2="676" y2="356" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ Écran 3 : Fiche recette ============ -->
  <text x="680" y="68" font-size="14" font-weight="bold" fill="#222">3. Fiche recette</text>
  <g transform="translate(680,76)">
    <rect width="280" height="560" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect width="280" height="50" fill="#e5e5e5" stroke="#333" stroke-width="2"/>
    <text x="16" y="31" font-size="16" font-weight="bold" fill="#222">← Tarte au sucre</text>

    <rect x="16" y="66" width="248" height="90" fill="#ececec" stroke="#555"/>
    <text x="140" y="108" font-size="30" font-weight="bold" fill="#222" text-anchor="middle">336 kcal</text>
    <text x="140" y="128" font-size="12" fill="#555" text-anchor="middle">par portion</text>
    <text x="140" y="146" font-size="11" fill="#555" text-anchor="middle">Total du plat : 2 691 kcal · 8 portions</text>

    <text x="16" y="186" font-size="13" font-weight="bold" fill="#222">Ingrédients</text>

    <rect x="16" y="196" width="248" height="30" fill="#f5f5f5" stroke="#555"/>
    <text x="26" y="216" font-size="12" fill="#222">Farine</text>
    <text x="254" y="216" font-size="12" fill="#555" text-anchor="end">250 g</text>

    <rect x="16" y="230" width="248" height="30" fill="#f5f5f5" stroke="#555"/>
    <text x="26" y="250" font-size="12" fill="#222">Beurre</text>
    <text x="254" y="250" font-size="12" fill="#555" text-anchor="end">100 g</text>

    <rect x="16" y="264" width="248" height="30" fill="#f5f5f5" stroke="#555"/>
    <text x="26" y="284" font-size="12" fill="#222">Sucre</text>
    <text x="254" y="284" font-size="12" fill="#555" text-anchor="end">120 g</text>

    <rect x="16" y="298" width="248" height="30" fill="#f5f5f5" stroke="#555"/>
    <text x="26" y="318" font-size="12" fill="#222">Crème</text>
    <text x="254" y="318" font-size="12" fill="#555" text-anchor="end">200 g</text>

    <rect x="16" y="500" width="248" height="44" fill="#444"/>
    <text x="140" y="527" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Partager la fiche</text>
  </g>
  <text x="680" y="668" font-size="12" fill="#444">« Partager la fiche » ouvre l'écran 4</text>

  <line x1="964" y1="356" x2="996" y2="356" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ Écran 4 : Partage ============ -->
  <text x="1000" y="68" font-size="14" font-weight="bold" fill="#222">4. Partage</text>
  <g transform="translate(1000,76)">
    <rect width="280" height="560" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect width="280" height="50" fill="#e5e5e5" stroke="#333" stroke-width="2"/>
    <text x="16" y="31" font-size="16" font-weight="bold" fill="#222">← Partager</text>

    <rect x="16" y="66" width="248" height="110" fill="#f5f5f5" stroke="#555"/>
    <text x="28" y="92" font-size="11" fill="#555">Aperçu de la fiche</text>
    <text x="28" y="118" font-size="15" font-weight="bold" fill="#222">Tarte au sucre</text>
    <text x="28" y="140" font-size="12" fill="#222">336 kcal par portion</text>
    <text x="28" y="160" font-size="11" fill="#555">Total : 2 691 kcal · 8 portions</text>

    <text x="16" y="206" font-size="13" font-weight="bold" fill="#222">Envoyer via</text>

    <rect x="16" y="216" width="248" height="40" fill="#fff" stroke="#555"/>
    <text x="28" y="241" font-size="13" fill="#222">Messagerie</text>

    <rect x="16" y="264" width="248" height="40" fill="#fff" stroke="#555"/>
    <text x="28" y="289" font-size="13" fill="#222">E-mail</text>

    <rect x="16" y="312" width="248" height="40" fill="#fff" stroke="#555"/>
    <text x="28" y="337" font-size="13" fill="#222">Copier le texte</text>

    <text x="16" y="386" font-size="11" fill="#888">Après l'envoi :</text>
    <rect x="16" y="394" width="248" height="44" fill="#e8e8e8" stroke="#555" stroke-dasharray="5,3"/>
    <text x="140" y="421" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Fiche partagée</text>

    <rect x="16" y="500" width="248" height="44" fill="#444"/>
    <text x="140" y="527" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Retour à la liste</text>
  </g>
  <text x="1000" y="668" font-size="12" fill="#444">Confirmation, puis retour à l'écran 1</text>

  <!-- ============ Écran 2b : Sélecteur d'ingrédients (depuis l'écran 2) ============ -->
  <text x="1320" y="68" font-size="14" font-weight="bold" fill="#222">2b. Sélecteur d'ingrédients</text>
  <g transform="translate(1320,76)">
    <rect width="280" height="560" fill="#fff" stroke="#333" stroke-width="2" stroke-dasharray="8,4"/>
    <rect width="280" height="50" fill="#e5e5e5" stroke="#333" stroke-width="2"/>
    <text x="16" y="31" font-size="16" font-weight="bold" fill="#222">← Ajouter un ingrédient</text>

    <rect x="16" y="64" width="248" height="34" fill="#fff" stroke="#555"/>
    <text x="26" y="86" font-size="12" fill="#888">Rechercher un ingrédient…</text>

    <rect x="16" y="108" width="248" height="38" fill="#fff" stroke="#555"/>
    <text x="26" y="131" font-size="12" fill="#222">Beurre</text>
    <text x="254" y="131" font-size="11" fill="#555" text-anchor="end">717 kcal / 100 g</text>

    <rect x="16" y="150" width="248" height="38" fill="#d9d9d9" stroke="#333" stroke-width="2"/>
    <text x="26" y="173" font-size="12" font-weight="bold" fill="#222">Farine</text>
    <text x="254" y="173" font-size="11" fill="#333" text-anchor="end">364 kcal / 100 g</text>

    <rect x="16" y="192" width="248" height="38" fill="#fff" stroke="#555"/>
    <text x="26" y="215" font-size="12" fill="#222">Sucre</text>
    <text x="254" y="215" font-size="11" fill="#555" text-anchor="end">387 kcal / 100 g</text>

    <rect x="16" y="234" width="248" height="38" fill="#fff" stroke="#555"/>
    <text x="26" y="257" font-size="12" fill="#222">Crème</text>
    <text x="254" y="257" font-size="11" fill="#555" text-anchor="end">300 kcal / 100 g</text>

    <text x="140" y="298" font-size="11" fill="#888" text-anchor="middle">(aucun résultat : « Aucun ingrédient trouvé »)</text>

    <rect x="0" y="322" width="280" height="238" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <text x="16" y="348" font-size="13" font-weight="bold" fill="#222">Farine · 364 kcal / 100 g</text>
    <text x="16" y="372" font-size="11" fill="#555">Quantité (g)</text>
    <rect x="16" y="378" width="150" height="38" fill="#fff" stroke="#555"/>
    <text x="26" y="402" font-size="14" fill="#222">250 g</text>
    <text x="180" y="402" font-size="12" font-weight="bold" fill="#222">= 910 kcal</text>
    <text x="16" y="440" font-size="11" fill="#555">Clavier numérique ouvert</text>
    <rect x="16" y="500" width="248" height="44" fill="#444"/>
    <text x="140" y="527" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Valider</text>
  </g>
  <text x="1320" y="668" font-size="12" fill="#444">S'ouvre depuis « + Ajouter un ingrédient » (écran 2)</text>
  <text x="1320" y="684" font-size="12" fill="#444">« Valider » : retour à l'écran 2, totaux mis à jour</text>
</svg>
